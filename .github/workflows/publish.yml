# Publish to PyPI when a version tag (v0.1.1, ...) is pushed.
#
# PyPI trusts this file by name through Trusted Publishing (OIDC): no token is stored anywhere. The
# trusted publisher on PyPI is eucassoc/physical-sandbox, workflow publish.yml, environment pypi;
# renaming this file or the environment breaks publishing until PyPI is told the new names.
# Run the tests on a computer before tagging: this workflow only builds, checks and uploads.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml" >&2
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/physical-sandbox/
    permissions:
      id-token: write  # the short-lived OIDC token PyPI checks; nothing else
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
