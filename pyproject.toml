[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-sandbox"
version = "0.1.1"
description = "Overlay robots on photos and videos of a real site at real scale, and compare motions with numbers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Atsushi Kojo" }]
dependencies = [
  "numpy",
  "opencv-python-headless",
  "mujoco>=3",
  "pyarrow",
  "matplotlib",
  "fast-simplification",
  "huggingface_hub>=0.34",
]
keywords = ["robotics", "lerobot", "sim-to-real", "augmented-reality", "urdf", "mujoco", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://physicalsandbox.com"
Repository = "https://github.com/eucassoc/physical-sandbox"
Issues = "https://github.com/eucassoc/physical-sandbox/issues"

[project.optional-dependencies]
sam = ["ultralytics"]
mcp = ["mcp>=2.3"]
dev = ["pytest", "pillow", "jsonschema", "pandas"]

[project.scripts]
psbx = "physical_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"physical_sandbox.mcp" = ["widgets/*.html", "widgets/lib/*.js", "widgets/vendor/*.js", "widgets/vendor/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sam: needs the [sam] extra, the SAM weights and the LeRobot dataset (skipped when absent)"]
