<!doctype html>
<meta charset="utf-8" />
<style>
  :root { --fg: #1d1f24; --muted: #5d6470; --bg: #ffffff; --accent: #2a7ab0; --err: #b3261e; color-scheme: light dark; }
  :root.dark { --fg: #e8eaee; --muted: #a0a6b0; --bg: #1c1d21; --accent: #6db3e3; --err: #ff8a80; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  .wrap { padding: 8px; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; border-radius: 6px; background: #222; }
  .objects { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .objects:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--muted); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  .chip .sw { width: 10px; height: 10px; border-radius: 2px; }
  .chip.off { opacity: .45; text-decoration: line-through; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .say { flex: 1 1 260px; color: var(--muted); }
  .say.err { color: var(--err); }
  label.measured { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .lengths label { display: inline-flex; align-items: center; gap: 4px; }
  .lengths input { width: 5em; font: inherit; padding: 3px 4px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); }
  .lengths select { font: inherit; padding: 3px 4px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); }
  button.decide { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.decide:disabled { opacity: .5; cursor: default; }
</style>
<div class="wrap">
  <canvas id="view" width="1280" height="720"></canvas>
  <div class="objects" id="objects"></div>
  <div class="bar lengths">
    <select id="preset" title="床に置いた物の大きさ">
      <option value="">長さを入力</option>
      <option value="21,29.7">A4 の紙（21 × 29.7 cm）</option>
      <option value="29.7,42">A3 の紙（29.7 × 42 cm）</option>
      <option value="110,110">パレット（110 × 110 cm）</option>
    </select>
    <label>辺 1→2 <input type="number" id="edgeA" min="0" step="any" /> cm</label>
    <label>辺 2→3 <input type="number" id="edgeB" min="0" step="any" /> cm</label>
    <button class="chip" id="swap" title="2 辺の長さを入れ替える">入れ替え</button>
  </div>
  <div class="bar">
    <span class="say" id="say">写真を読み込んでいます…</span>
    <label class="measured"><input type="checkbox" id="measured" /> 長さは実測した値</label>
    <button class="decide" id="decide" disabled>決定</button>
  </div>
</div>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
/*__LIB:floor__*/
const { App } = globalThis.ExtApps;
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const sayEl = document.getElementById('say');
const say = (s, isError = false) => { sayEl.textContent = s; sayEl.classList.toggle('err', isError); };
// Failures inside the screen are otherwise invisible: every one ends up in the bottom line.
const fail = (what, err) => say(`${what}: ${err?.message ?? err}`, true);
window.addEventListener('error', (e) => fail('画面でエラーが起きました', e.error ?? e.message));
window.addEventListener('unhandledrejection', (e) => fail('画面でエラーが起きました', e.reason));

const decideButton = document.getElementById('decide');
const measuredBox = document.getElementById('measured');
const objectsEl = document.getElementById('objects');
const presetEl = document.getElementById('preset');
const edgeA = document.getElementById('edgeA');
const edgeB = document.getElementById('edgeB');
const swapButton = document.getElementById('swap');

const COLORS = ['#3ddc97', '#4cc9f0', '#f72585', '#ffd166', '#b388ff', '#ff7b54', '#80ed99', '#64dfdf'];

let state = null;      // { imagePath, width, height, edgesM, corners, siteDir, objects, objectsKey, objectsParts }
let photo = null;      // the decoded image
let grid = null;       // lines in photo pixels, or null
let keep = new Set();  // names of the objects the person keeps
let dragging = -1;
let solving = false;
let again = false;
let solvedOk = false;
let decidedOnce = false; // a site file was written for this screen
let dirty = true;        // something changed since the last 決定 (or nothing was decided yet)
let generation = 0;      // counts the tool results; an older one's photo load must not touch the newer

const app = new App({ name: 'PsFitFloor', version: '0.1.0' }, {}, { autoResize: true });

// One call to the server: the JSON it answers, or an Error saying what went wrong
async function call(name, args) {
  const res = await app.callServerTool({ name, arguments: args });
  const text = res?.content?.[0]?.text;
  if (res?.isError) throw new Error(`${name}: ${text ?? 'エラー'}`);
  try { return JSON.parse(text); }
  catch { throw new Error(`${name}: 答えを読めませんでした（${String(text).slice(0, 200)}）`); }
}

function toPhoto(e) {
  const r = canvas.getBoundingClientRect();
  return { u: (e.clientX - r.left) / r.width * state.width, v: (e.clientY - r.top) / r.height * state.height };
}

const colorOf = (i) => COLORS[i % COLORS.length];

function drawObject(o, i, k) {
  const color = colorOf(i);
  const pts = o.outline ?? [];
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = color;
  ctx.fillStyle = color + '33';
  if (pts.length > 1) {
    ctx.beginPath();
    pts.forEach(([u, v], j) => (j ? ctx.lineTo(u * k, v * k) : ctx.moveTo(u * k, v * k)));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  // Where it touches the ground
  ctx.fillStyle = color;
  for (const [u, v] of o.ground_px ?? []) { ctx.beginPath(); ctx.arc(u * k, v * k, 4, 0, 2 * Math.PI); ctx.fill(); }
  // Its name (never a number alone), on a dark plate above the outline's top-left
  const top = pts.length ? pts.reduce((a, p) => (p[1] < a[1] ? p : a)) : [o.box[0], o.box[1]];
  const left = pts.length ? Math.min(...pts.map((p) => p[0])) : o.box[0];
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(o.name).width + 12;
  const x = Math.min(Math.max(left * k, 0), canvas.width - w);
  const y = Math.max(top[1] * k - 14, 11);
  ctx.fillStyle = 'rgba(20, 22, 26, 0.8)';
  ctx.fillRect(x, y - 11, w, 22);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x, y - 11, w, 22);
  ctx.fillStyle = '#fff';
  ctx.fillText(o.name, x + 6, y + 1);
}

function draw() {
  if (!state) return;
  const k = canvas.width / state.width;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (photo) ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);
  drawGrid(ctx, k, grid); // the faint floor and its 1 m grid
  // The objects the person keeps, each in its own colour
  (state.objects ?? []).forEach((o, i) => { if (keep.has(o.name)) drawObject(o, i, k); });
  drawCorners(ctx, k, state.corners);
}

// The chips under the picture: press one to keep or drop that object
function showChips() {
  objectsEl.replaceChildren();
  (state.objects ?? []).forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (keep.has(o.name) ? '' : ' off');
    b.title = keep.has(o.name) ? '押すと、この物体を使わない' : '押すと、この物体を使う';
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = colorOf(i);
    b.append(sw, document.createTextNode(o.name));
    b.addEventListener('click', () => {
      if (keep.has(o.name)) keep.delete(o.name); else keep.add(o.name);
      showChips();
      draw();
      changed('物体の選択を変えました');
    });
    objectsEl.append(b);
  });
}

// 決定 is enabled while the floor solves and there is something new to decide
function updateDecide() { decideButton.disabled = !(solvedOk && dirty); }
function changed(why) {
  dirty = true;
  updateDecide();
  if (decidedOnce) say(`${why}。もう一度「決定」すると、場所のファイルを上書きします`);
}

// The two edge lengths, shown in centimetres; the preset menu shows which known object they are, if any
function showEdges() {
  [edgeA.value, edgeB.value] = state.edgesM.map(cmOf);
  const key = `${cmOf(state.edgesM[0])},${cmOf(state.edgesM[1])}`;
  presetEl.value = [...presetEl.options].some((o) => o.value === key) ? key : '';
}
// Read the lengths the person typed; a length that is not a positive number keeps 決定 off and says so
function readEdges(why) {
  const a = Number(edgeA.value), b = Number(edgeB.value);
  if (!(a > 0 && b > 0 && Number.isFinite(a) && Number.isFinite(b))) {
    solvedOk = false;
    updateDecide();
    say('辺の長さは cm の正の数で入力してください', true);
    return;
  }
  state.edgesM = [a / 100, b / 100];
  showEdges();
  changed(why);
  solve();
}
edgeA.addEventListener('change', () => readEdges('長さを変えました'));
edgeB.addEventListener('change', () => readEdges('長さを変えました'));
presetEl.addEventListener('change', () => {
  if (!presetEl.value) return;
  [edgeA.value, edgeB.value] = presetEl.value.split(',');
  readEdges('長さを変えました');
});
swapButton.addEventListener('click', () => {
  [edgeA.value, edgeB.value] = [edgeB.value, edgeA.value];
  readEdges('長さを入れ替えました');
});

const floorOk = (stepM) => `床（薄い格子、${stepLabel(stepM)} ごと）が地面に合っていれば「決定」を、ずれていれば橙の角をつかんで指定し直してください`;

// Solve on the server, at most one call in flight
async function solve() {
  if (solving) { again = true; return; }
  solving = true;
  const mine = state;
  try {
    const out = await call('ps_floor_solve', { width: mine.width, height: mine.height, corners: mine.corners, edgesM: mine.edgesM });
    if (mine !== state) { again = true; return; } // a newer tool result replaced the state meanwhile
    grid = out.ok ? out.lines : null;
    solvedOk = !!out.ok;
    if (out.ok) {
      const note = (out.mirrored ? '。角が逆回りなので、床を鏡に映して解きました' : '')
        + (decidedOnce && dirty ? '。もう一度「決定」すると、場所のファイルを上書きします' : '');
      const names = (state.objects ?? []).length ? `。物体 ${(state.objects ?? []).length} 個` : '';
      say(`${floorOk(out.stepM)}（画角 ${out.fovDeg}°、ずれ ${out.residualPx} 画素${names}）${note}`);
    } else {
      say(`この角の位置では床が決まりません（${out.reason}）。角を動かしてください`, true);
    }
    updateDecide();
  } catch (err) {
    solvedOk = false;
    updateDecide();
    fail('サーバに届きませんでした', err);
  } finally {
    solving = false;
    draw();
    if (again) { again = false; if (state) solve(); }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (!state) return;
  const p = toPhoto(e);
  const reach = 22 / (canvas.getBoundingClientRect().width / state.width);
  dragging = hitCorner(state.corners, p, reach);
  if (dragging >= 0) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (dragging < 0) return;
  state.corners[dragging] = toPhoto(e);
  dirty = true;
  updateDecide();
  draw();
  solve();
});
// However a drag ends (also when the browser cancels it or takes the pointer away), it ends
const endDrag = () => { dragging = -1; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('lostpointercapture', endDrag);
measuredBox.addEventListener('change', () => changed('長さの扱いを変えました'));

decideButton.addEventListener('click', async () => {
  decideButton.disabled = true;
  let out;
  try {
    const corners = state.corners.map((c) => ({ u: Math.round(c.u * 10) / 10, v: Math.round(c.v * 10) / 10 }));
    const objects = (state.objects ?? []).filter((o) => keep.has(o.name)).map((o) => ({ name: o.name, kind: o.kind }));
    out = await call('ps_site_decide', {
      siteDir: state.siteDir, imagePath: state.imagePath, corners, edgesM: state.edgesM, objects,
      measured: measuredBox.checked,
    });
    if (!out.ok) {
      say(`場所を決定できませんでした: ${out.reason}`, true);
      updateDecide();
      return;
    }
    out.names = objects.map((o) => o.name);
  } catch (err) {
    fail('決定できませんでした', err);
    updateDecide();
    return;
  }
  // The site file is written. Whatever happens to the message, the site is decided.
  decidedOnce = true;
  dirty = false;
  updateDecide();
  say(`決定しました。場所のファイルを書きました: ${out.sitePath}`);
  if (app.kind === 'local') { // the browser screen: nobody to tell, the terminal shows the file
    say(`決定しました。場所のファイルを書きました: ${out.sitePath}。直すなら角や長さを変えてもう一度「決定」を、終わりなら端末で Ctrl-C を押してください`);
    return;
  }
  const lengths = `辺 1→2 ${cmOf(state.edgesM[0])} cm、辺 2→3 ${cmOf(state.edgesM[1])} cm（${measuredBox.checked ? '実測' : '推定'}）`;
  try {
    await app.sendMessage({
      role: 'user',
      content: [{ type: 'text', text: `場所を決定しました。場所のファイル: ${out.sitePath}、ずれ ${out.residualPx} 画素、物体: ${out.names.length ? out.names.join('、') : 'なし'}、長さ: ${lengths}` }],
    });
    say('決定しました。チャットに結果を返しました');
  } catch (err) {
    fail(`場所のファイルは書きましたが（${out.sitePath}）、チャットに結果を返せませんでした。チャットで「決定した」と伝えてください`, err);
  }
});

app.ontoolresult = async ({ content, isError }) => {
  const mine = ++generation; // a newer result makes this one stop wherever it is
  try {
    const text = content?.[0]?.text;
    if (isError) throw new Error(text ?? 'エラー');
    const next = JSON.parse(text);
    state = next;
    photo = null;
    grid = null;
    dragging = -1;
    solvedOk = false;
    decidedOnce = false;
    dirty = true;
    keep = new Set((next.objects ?? []).map((o) => o.name));
    if (typeof next.measured === 'boolean') measuredBox.checked = next.measured;
    showEdges();
    updateDecide();
    canvas.width = 1280;
    canvas.height = Math.round(1280 * next.height / next.width);
    showChips();
    draw();
    // The objects' outlines and ground points, which the model's result leaves out, in parts by key
    if (next.objectsKey) {
      let text = '';
      for (let part = 0; part < next.objectsParts; part += 1) {
        const out = await call('ps_objects_part', { key: next.objectsKey, part });
        if (mine !== generation) return;
        text += out.data;
      }
      const shapes = new Map(JSON.parse(text).objects.map((o) => [o.name, o]));
      for (const o of next.objects ?? []) Object.assign(o, shapes.get(o.name) ?? {});
      draw();
    }
    // The photo in parts: one result per part keeps each under the host's size cap
    let b64 = '';
    for (let part = 0; part < next.parts; part += 1) {
      say(`写真を読み込んでいます…（${part + 1}/${next.parts}）`);
      const out = await call('ps_spike_image', { imagePath: next.imagePath, part });
      if (mine !== generation) return;
      b64 += out.data;
    }
    const img = new Image();
    img.onload = () => { if (mine !== generation) return; photo = img; draw(); solve(); };
    img.onerror = () => { if (mine === generation) say('写真を表示できませんでした', true); };
    img.src = `data:image/jpeg;base64,${b64}`;
  } catch (err) {
    if (mine === generation) fail('写真を読み込めませんでした', err);
  }
};

app.onhostcontextchanged = (c) => document.documentElement.classList.toggle('dark', c?.theme === 'dark');
try {
  await app.connect();
  document.documentElement.classList.toggle('dark', app.getHostContext()?.theme === 'dark');
} catch (err) {
  fail('チャットとつながりませんでした', err);
}
</script>
