<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physical Sandbox ステージ</title>
<style>
  :root { --fg: #1d1f24; --muted: #5d6470; --bg: #ffffff; --panel: #f4f5f7; --line: #d8dbe0; --accent: #2a7ab0; --err: #b3261e; color-scheme: light dark; }
  :root.dark { --fg: #e8eaee; --muted: #a0a6b0; --bg: #1c1d21; --panel: #25272c; --line: #3a3d44; --accent: #6db3e3; --err: #ff8a80; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  .page { max-width: 1100px; margin: 0 auto; padding: 8px 12px 64px; }
  section { margin-top: 12px; padding: 8px 12px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  section h2 { margin: 0 0 4px; font-size: 15px; }
  section .hint { margin: 0; color: var(--muted); }
  section.locked { opacity: .6; }
  canvas { display: block; width: 100%; height: auto; touch-action: none; border-radius: 6px; background: #222; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 12px; border: 1px solid var(--muted); background: transparent; color: var(--fg); font: inherit; cursor: pointer; }
  label.measured { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  .lengths label { display: inline-flex; align-items: center; gap: 4px; }
  .lengths input { width: 5em; font: inherit; padding: 3px 4px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); }
  .lengths select { font: inherit; padding: 3px 4px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); }
  button.decide { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.decide:disabled { opacity: .5; cursor: default; }
  .stack { position: relative; border-radius: 6px; overflow: hidden; background: #222; margin-top: 8px; }
  .stack canvas { display: block; width: 100%; height: auto; border-radius: 0; }
  .stack canvas + canvas { position: absolute; inset: 0; height: 100%; background: transparent; }
  .stack canvas#mview { cursor: grab; }
  .machinebar input[type=text], .machinebar input[type=search] { font: inherit; padding: 3px 6px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); min-width: 0; flex: 1 1 12em; }
  .machinebar select, .placebar input[type=number] { font: inherit; padding: 3px 4px; border: 1px solid var(--muted); border-radius: 4px; background: transparent; color: var(--fg); }
  .placebar input[type=number] { width: 5.5em; }
  .placebar label { display: inline-flex; align-items: center; gap: 4px; }
  .placebar input[type=range] { width: 180px; }
  .hits:empty { display: none; }
  .floorsay { flex: 1 1 260px; color: var(--muted); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 6px 12px; background: var(--bg); border-top: 1px solid var(--line); }
  .say { flex: 1 1 auto; color: var(--muted); overflow-wrap: anywhere; }
  .say.err { color: var(--err); }
  .login { flex: none; text-align: right; color: var(--muted); }
</style>
<div class="page">
  <section id="floor">
    <h2>床</h2>
    <p class="hint">写真の床の 4 つの角を、地面の長方形に合わせて決定します</p>
    <canvas id="view" width="1280" height="720"></canvas>
    <div class="bar lengths">
      <select id="preset" title="床に置いた物の大きさ">
        <option value="">長さを入力</option>
        <option value="21,29.7">A4 の紙（21 × 29.7 cm）</option>
        <option value="29.7,42">A3 の紙（29.7 × 42 cm）</option>
        <option value="110,110">パレット（110 × 110 cm）</option>
      </select>
      <label>辺 1→2 <input type="number" id="edgeA" min="0" step="any" /> cm</label>
      <label>辺 2→3 <input type="number" id="edgeB" min="0" step="any" /> cm</label>
      <button class="chip" id="swap" title="2 辺の長さを入れ替える">入れ替え</button>
    </div>
    <div class="bar">
      <span class="floorsay" id="floorsay"></span>
      <label class="measured"><input type="checkbox" id="measured" /> 長さは実測した値</label>
      <button class="decide" id="decide" disabled>決定</button>
    </div>
  </section>
  <section id="machine" class="locked">
    <h2>ロボット</h2>
    <p class="hint" id="machinehint">床を決定すると使えます</p>
    <div id="machineBody" hidden>
      <div class="bar machinebar">
        <select id="machinePick" title="置くロボット"></select>
        <input type="search" id="catalogQ" placeholder="公開カタログを検索" />
        <button class="chip" id="catalogGo">検索</button>
        <input type="text" id="urdfPath" placeholder="URDF ファイルのパス" />
        <button class="chip" id="urdfOpen">開く</button>
      </div>
      <div class="bar hits" id="catalogHits"></div>
      <div class="stack">
        <canvas id="mphoto" width="1280" height="720"></canvas>
        <canvas id="mgl" width="1280" height="720"></canvas>
        <canvas id="mview" width="1280" height="720"></canvas>
      </div>
      <div class="bar placebar">
        <label>x <input type="number" id="px" step="0.01" /> m</label>
        <label>y <input type="number" id="py" step="0.01" /> m</label>
        <label>向き <input type="range" id="yaw" min="-180" max="180" step="1" value="0" />
          <input type="number" id="yawNum" min="-180" max="180" step="1" value="0" /> °</label>
        <button class="decide" id="place" disabled>決定</button>
      </div>
    </div>
  </section>
  <section id="motion" class="locked">
    <h2>動き</h2>
    <p class="hint">ロボットを置くと使えます</p>
  </section>
  <section id="compare" class="locked">
    <h2>比べる</h2>
    <p class="hint">2 つの動きを選ぶと使えます</p>
  </section>
</div>
<div class="bottom">
  <span class="say" id="say">写真を読み込んでいます…</span>
  <span class="login" id="login"></span>
</div>
<script>/*__THREE__*/</script>
<script type="module">
/*__EXT_APPS_BUNDLE__*/
/*__LIB:floor__*/
/*__LIB:shells__*/
const { App } = globalThis.ExtApps;
const THREE = globalThis.THREE;
const canvas = document.getElementById('view');
const ctx = canvas.getContext('2d');
const sayEl = document.getElementById('say');
const say = (s, isError = false) => { sayEl.textContent = s; sayEl.classList.toggle('err', isError); };
// Failures inside the screen are otherwise invisible: every one ends up in the bottom line.
const fail = (what, err) => say(`${what}: ${err?.message ?? err}`, true);
window.addEventListener('error', (e) => fail('画面でエラーが起きました', e.error ?? e.message));
window.addEventListener('unhandledrejection', (e) => fail('画面でエラーが起きました', e.reason));

const decideButton = document.getElementById('decide');
const measuredBox = document.getElementById('measured');
const presetEl = document.getElementById('preset');
const edgeA = document.getElementById('edgeA');
const edgeB = document.getElementById('edgeB');
const swapButton = document.getElementById('swap');
const floorSay = document.getElementById('floorsay');
const loginEl = document.getElementById('login');

let state = null;      // the first(): { imagePath, width, height, parts, camera, floor, login, workDir, ... }
let photo = null;      // the decoded image
let grid = null;       // lines in photo pixels, or null
let corners = [];      // the floor's four corners being edited, {u, v} in photo pixels
let edgesM = [];       // the floor's two lengths being edited, metres
let dragging = -1;
let solving = false;
let again = false;
let solvedOk = false;
let decidedOnce = false; // a site file exists for this floor
let dirty = true;        // something changed since the last 決定 (or nothing was decided yet)

const app = new App({ name: 'PsStage', version: '0.1.0' }, {}, { autoResize: true });

// One call to the server: the JSON it answers, or an Error saying what went wrong
async function call(name, args) {
  const res = await app.callServerTool({ name, arguments: args });
  const text = res?.content?.[0]?.text;
  if (res?.isError) throw new Error(`${name}: ${text ?? 'エラー'}`);
  try { return JSON.parse(text); }
  catch { throw new Error(`${name}: 答えを読めませんでした（${String(text).slice(0, 200)}）`); }
}

function toPhoto(e) {
  const r = canvas.getBoundingClientRect();
  return { u: (e.clientX - r.left) / r.width * state.width, v: (e.clientY - r.top) / r.height * state.height };
}

function draw() {
  if (!state) return;
  const k = canvas.width / state.width;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (photo) ctx.drawImage(photo, 0, 0, canvas.width, canvas.height);
  drawGrid(ctx, k, grid); // the faint floor and its grid
  drawCorners(ctx, k, corners);
}

// 決定 is enabled while the floor solves and there is something new to decide
function updateDecide() { decideButton.disabled = !(solvedOk && dirty); }
function changed(why) {
  dirty = true;
  updateDecide();
  if (decidedOnce) say(`${why}。もう一度「決定」すると、場所のファイルを上書きします`);
}

// The sections after the floor open once a floor is decided
function openSections() {
  document.getElementById('machine').classList.remove('locked');
  document.getElementById('machineBody').hidden = false;
  document.getElementById('machinehint').textContent =
    'ロボットを選択し、写真の床の上へドラッグして置き、向きを合わせて「決定」してください';
  startMachines().catch((err) => fail('ロボットの一覧を取得できませんでした', err));
}

// ---- The machine step: pick a machine, see its shell on the floor, drag it, turn it, 決定 ----

const MACHINE_COLORS = ['#2f7fe0'];
const pickEl = document.getElementById('machinePick');
const catalogQ = document.getElementById('catalogQ');
const catalogHits = document.getElementById('catalogHits');
const urdfPath = document.getElementById('urdfPath');
const pxEl = document.getElementById('px');
const pyEl = document.getElementById('py');
const yawEl = document.getElementById('yaw');
const yawNum = document.getElementById('yawNum');
const placeButton = document.getElementById('place');
const mPhoto = document.getElementById('mphoto');
const mGl = document.getElementById('mgl');
const mView = document.getElementById('mview');
const mctx = mView.getContext('2d');
const CATALOG_FIRST = 'physical-sandbox/so101';

let machines = [];       // the list the server gave: { id, urdf, source, label }
let machineStarted = false;
let machineGen = 0;      // counts the opens: an older one's loads must not touch the newer
let current = null;      // { id, urdf, typed } of the machine that is open
let mdata = null;        // what ps_machine_open answered
let mThree = null;       // the shells (three), once built
let place = { x: 0, y: 0, yaw: 0 };   // metres, metres, degrees
let placeDirty = false;
let mDrag = null;        // { dx, dy }: the base's offset from the grabbed floor point

async function fetchParts(name, args, count) {
  const out = new Array(count);
  let next = 0;
  const worker = async () => {
    while (next < count) {
      const part = next++;
      out[part] = (await call(name, { ...args, part })).data;
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  return out.join('');
}

// The machine's base transform, row by row (as scene.py's base_transform does it)
function baseOf() {
  const a = place.yaw * Math.PI / 180;
  const c = Math.cos(a), s = Math.sin(a);
  return [c, -s, 0, place.x, s, c, 0, place.y, 0, 0, 1, 0, 0, 0, 0, 1];
}

// The pixel of the floor point (x, y, 0) through the pinhole camera, or null behind it
function pixelOfFloor(camera, x, y) {
  const r = camera.extr.R, t = camera.extr.t, k = camera.intr;
  const z = r[6] * x + r[7] * y + t[2];
  if (!(z > 1e-9)) return null;
  return { u: k.fx * (r[0] * x + r[1] * y + t[0]) / z + k.cx, v: k.fy * (r[3] * x + r[4] * y + t[1]) / z + k.cy };
}

function drawMachinePhoto() {
  const c = mPhoto.getContext('2d');
  c.fillStyle = '#222';
  c.fillRect(0, 0, mPhoto.width, mPhoto.height);
  if (photo) c.drawImage(photo, 0, 0, mPhoto.width, mPhoto.height);
}

function drawMachine() {
  if (!state) return;
  const k = mView.width / state.width;
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  mctx.clearRect(0, 0, mView.width, mView.height);
  if (!mdata) return;
  mctx.setTransform(k, 0, 0, k, 0, 0);
  if (mdata.floor) {
    strokePath(mctx, mdata.floor, true);
    mctx.fillStyle = 'rgba(255,255,255,0.10)';
    mctx.fill();
    mctx.strokeStyle = 'rgba(255,255,255,0.9)';
    mctx.lineWidth = 2.5 / k;
    mctx.setLineDash([10 / k, 6 / k]);
    mctx.stroke();
    mctx.setLineDash([]);
  }
  const p = pixelOfFloor(mdata.camera, place.x, place.y);
  if (p) {   // where the base stands, and which way it faces
    const a = place.yaw * Math.PI / 180;
    const q = pixelOfFloor(mdata.camera, place.x + 0.1 * Math.cos(a), place.y + 0.1 * Math.sin(a));
    mctx.strokeStyle = '#ffffff';
    mctx.fillStyle = MACHINE_COLORS[0];
    mctx.lineWidth = 2 / k;
    mctx.beginPath(); mctx.arc(p.u, p.v, 6 / k, 0, 2 * Math.PI); mctx.fill(); mctx.stroke();
    if (q) { mctx.beginPath(); mctx.moveTo(p.u, p.v); mctx.lineTo(q.u, q.v); mctx.stroke(); }
  }
  if (mThree) drawShells(mThree, [mdata.zeroPoses], baseOf(), [true]);
}

function showPlace() {
  pxEl.value = String(Math.round(place.x * 1000) / 1000);
  pyEl.value = String(Math.round(place.y * 1000) / 1000);
  yawEl.value = yawNum.value = String(Math.round(place.yaw));
}

function setPlace(next) {
  place = { ...place, ...next };
  place.yaw = ((place.yaw + 180) % 360 + 360) % 360 - 180;   // -180 .. 180
  placeDirty = true;
  placeButton.disabled = !mdata;
  showPlace();
  drawMachine();
}

function releaseMachine() {
  releaseShells(mThree);
  mThree = null;
  mdata = null;
}

async function openMachine(urdf, id, { typed = false, keep = false } = {}) {
  const mine = ++machineGen;
  releaseMachine();
  drawMachinePhoto();
  drawMachine();
  placeButton.disabled = true;
  if (!keep) say(`ロボット ${id} を読み込んでいます…`);
  try {
    const out = await call('ps_machine_open', typed ? { urdf, id, typed: true } : { urdf, id });
    if (mine !== machineGen) return;
    mdata = out;
    current = { id: out.id, urdf: out.urdf, typed };
    if (!keep) {
      place = out.placed ? { x: out.placed.x, y: out.placed.y, yaw: out.placed.yaw * 180 / Math.PI } : { x: out.center.x, y: out.center.y, yaw: 0 };
    }
    showPlace();
    placeDirty = !out.placed || keep && placeDirty;
    placeButton.disabled = !placeDirty;
    drawMachine();
    if (!THREE) throw new Error('three が読み込まれていません');
    const m = out.model;
    const buffer = bytesOf(await fetchParts('ps_model_part', { key: m.key }, m.binParts));
    if (mine !== machineGen) return;
    const built = buildShells(mGl, m, buffer, MACHINE_COLORS);
    // near 0.05 m: the same near clip as the replay video, so a close machine is cut alike
    built.camera = new THREE.PerspectiveCamera(50, 1, 0.05, 600);
    placeCamera(built.camera, out.camera);
    mThree = built;
    drawMachine();
    // The first frame of a fresh WebGL canvas can reach the screen opaque black in some browsers: draw once more
    requestAnimationFrame(() => { if (mine === machineGen) drawMachine(); });
    if (out.placed) document.getElementById('motion').classList.remove('locked');   // this folder already places it
    if (!keep) {
      say(out.placed
        ? `${out.id} は決定済みの位置に表示しています。動かした場合は、もう一度「決定」してください`
        : `${out.id} を床に置きました（仮）。ドラッグで動かし、向きを合わせて「決定」してください`);
    }
  } catch (err) {
    if (mine === machineGen) fail('ロボットを表示できませんでした', err);
  }
}

// The select: a neutral first line that is selected (so the hint shows and nothing is pulled on its own); when no
// machine is here yet, the catalog's so101 as a second line, so that choosing it fires `change` and pulls it
function fillPick(selectUrdf) {
  pickEl.textContent = '';
  const add = (value, text) => {
    const o = document.createElement('option');
    o.value = value;
    o.textContent = text;
    pickEl.append(o);
  };
  add('', 'ロボットを選択してください');
  if (!machines.length) add(`catalog:${CATALOG_FIRST}`, `${CATALOG_FIRST}（公開カタログから取得）`);
  machines.forEach((m, i) => {
    add(String(i), m.source === 'catalog' ? m.label : `${m.label}（${m.source === 'cache' ? 'キャッシュ' : 'フォルダ'}）`);
  });
  const at = machines.findIndex((m) => m.urdf === selectUrdf);
  pickEl.value = at >= 0 ? String(at) : '';
}

async function listMachines(selectUrdf = null) {
  machines = (await call('ps_machines_list', {})).machines;
  fillPick(selectUrdf);
}

async function startMachines() {
  if (machineStarted) {   // the floor was decided again: the camera and the floor are new
    if (current) openMachine(current.urdf, current.id, { typed: current.typed, keep: true });
    return;
  }
  machineStarted = true;
  await listMachines();
  const m = state.machine;
  if (m) {   // this folder already places a machine: show it where it stands
    await listMachines(m.urdf);
    openMachine(m.urdf, m.id);
  }
}

async function pullAndOpen(ref) {
  say(`${ref} を公開カタログから取得しています…`);
  const out = await call('ps_catalog_pull', { ref });
  if (out.error) { say(out.error, true); return; }
  await listMachines(out.urdf);
  openMachine(out.urdf, out.id);
}

pickEl.addEventListener('change', () => {
  const v = pickEl.value;
  if (v.startsWith('catalog:')) { pullAndOpen(v.slice('catalog:'.length)).catch((err) => fail('取得できませんでした', err)); return; }
  if (v === '') return;
  const m = machines[Number(v)];
  openMachine(m.urdf, m.id);
});

async function searchCatalog() {
  say('公開カタログを検索しています…');
  const out = await call('ps_catalog_search', { q: catalogQ.value.trim() });
  if (out.error) { say(out.error, true); return; }
  catalogHits.textContent = '';
  for (const item of out.items) {
    const ref = item.version ? `${item.ref}:${item.version}` : item.ref;
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = `${item.label}（${item.ref}${item.private ? '・非公開' : ''}）を取得`;
    chip.addEventListener('click', () => pullAndOpen(ref).catch((err) => fail('取得できませんでした', err)));
    catalogHits.append(chip);
  }
  say(out.items.length ? `${out.items.length} 件見つかりました。取得するものを選択してください` : '見つかりませんでした');
}
document.getElementById('catalogGo').addEventListener('click', () => searchCatalog().catch((err) => fail('検索できませんでした', err)));
catalogQ.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('catalogGo').click(); });

function openTyped() {
  const path = urdfPath.value.trim();
  if (!path) { say('URDF ファイルのパスを入力してください', true); return; }
  const id = path.split(/[\\/]/).pop().replace(/\.urdf$/i, '') || 'robot';
  openMachine(path, id, { typed: true });
}
document.getElementById('urdfOpen').addEventListener('click', openTyped);
urdfPath.addEventListener('keydown', (e) => { if (e.key === 'Enter') openTyped(); });

// The numbers beside the picture
for (const [el, key] of [[pxEl, 'x'], [pyEl, 'y']]) {
  el.addEventListener('change', () => {
    const n = Number(el.value);
    if (el.value.trim() === '' || !Number.isFinite(n)) { showPlace(); return; }
    setPlace({ [key]: n });
  });
}
yawEl.addEventListener('input', () => setPlace({ yaw: Number(yawEl.value) }));
yawNum.addEventListener('change', () => {
  const n = Number(yawNum.value);
  if (yawNum.value.trim() === '' || !Number.isFinite(n)) { showPlace(); return; }
  setPlace({ yaw: n });
});

// Dragging: the base follows the floor point under the pointer (the lens is already undone in the picture)
function toMachinePhoto(e) {
  const r = mView.getBoundingClientRect();
  return { u: (e.clientX - r.left) / r.width * state.width, v: (e.clientY - r.top) / r.height * state.height };
}
mView.addEventListener('pointerdown', (e) => {
  if (!state || !mdata) return;
  const q = toMachinePhoto(e);
  const p = pixelOfFloor(mdata.camera, place.x, place.y);
  const reach = 60 / (mView.getBoundingClientRect().width / state.width);   // 60 screen pixels
  if (!p || Math.hypot(q.u - p.u, q.v - p.v) > reach) return;
  const f = floorPointJs(mdata.camera, q.u, q.v);
  if (!f) return;
  mDrag = { dx: place.x - f.x, dy: place.y - f.y };
  mView.setPointerCapture(e.pointerId);
});
mView.addEventListener('pointermove', (e) => {
  if (!mDrag) return;
  const q = toMachinePhoto(e);
  const f = floorPointJs(mdata.camera, q.u, q.v);
  if (f) setPlace({ x: f.x + mDrag.dx, y: f.y + mDrag.dy });
});
const endMachineDrag = () => { mDrag = null; };
mView.addEventListener('pointerup', endMachineDrag);
mView.addEventListener('pointercancel', endMachineDrag);
mView.addEventListener('lostpointercapture', endMachineDrag);

placeButton.addEventListener('click', async () => {
  if (!mdata) return;
  placeButton.disabled = true;
  try {
    const out = await call('ps_scene_place', {
      id: mdata.id, urdf: mdata.urdf,
      x: Math.round(place.x * 1000) / 1000, y: Math.round(place.y * 1000) / 1000, yaw: place.yaw * Math.PI / 180 });
    placeDirty = false;
    document.getElementById('motion').classList.remove('locked');
    say(`決定しました。シーンのファイルを書きました: ${out.scenePath}`);
  } catch (err) {
    placeButton.disabled = false;
    fail('決定できませんでした', err);
  }
});

function showLogin(login) {
  loginEl.textContent = login?.signedIn
    ? `ログイン中: ${login.handle ?? ''}`
    : '未ログイン（公開カタログのみ）';
}

// The two edge lengths, shown in centimetres; the preset menu shows which known object they are, if any
function showEdges() {
  [edgeA.value, edgeB.value] = edgesM.map(cmOf);
  const key = `${cmOf(edgesM[0])},${cmOf(edgesM[1])}`;
  presetEl.value = [...presetEl.options].some((o) => o.value === key) ? key : '';
}
// Read the lengths the person typed; a length that is not a positive number keeps 決定 off and says so
function readEdges(why) {
  const a = Number(edgeA.value), b = Number(edgeB.value);
  if (!(a > 0 && b > 0 && Number.isFinite(a) && Number.isFinite(b))) {
    solvedOk = false;
    updateDecide();
    floorSay.textContent = '辺の長さは cm の正の数で入力してください';
    say('辺の長さは cm の正の数で入力してください', true);
    return;
  }
  edgesM = [a / 100, b / 100];
  showEdges();
  changed(why);
  solve();
}
edgeA.addEventListener('change', () => readEdges('長さを変えました'));
edgeB.addEventListener('change', () => readEdges('長さを変えました'));
presetEl.addEventListener('change', () => {
  if (!presetEl.value) return;
  [edgeA.value, edgeB.value] = presetEl.value.split(',');
  readEdges('長さを変えました');
});
swapButton.addEventListener('click', () => {
  [edgeA.value, edgeB.value] = [edgeB.value, edgeA.value];
  readEdges('長さを入れ替えました');
});

const floorOk = (stepM) => `床（薄い格子、${stepLabel(stepM)} ごと）が地面に合っていれば「決定」を、ずれていれば橙の角をつかんで指定し直してください`;

// Solve on the server, at most one call in flight
async function solve() {
  if (solving) { again = true; return; }
  solving = true;
  try {
    const out = await call('ps_floor_solve', { width: state.width, height: state.height, corners, edgesM });
    grid = out.ok ? out.lines : null;
    solvedOk = !!out.ok;
    if (out.ok) {
      const note = (out.mirrored ? '。角が逆回りなので、床を鏡に映して解きました' : '')
        + (decidedOnce && dirty ? '。もう一度「決定」すると、場所のファイルを上書きします' : '');
      const text = `${floorOk(out.stepM)}（画角 ${out.fovDeg}°、ずれ ${out.residualPx} 画素）${note}`;
      floorSay.textContent = text;
      say(text);
    } else {
      const text = `この角の位置では床が決まりません（${out.reason}）。角を動かしてください`;
      floorSay.textContent = text;
      say(text, true);
    }
    updateDecide();
  } catch (err) {
    solvedOk = false;
    updateDecide();
    fail('サーバに届きませんでした', err);
  } finally {
    solving = false;
    draw();
    if (again) { again = false; solve(); }
  }
}

canvas.addEventListener('pointerdown', (e) => {
  if (!state) return;
  const p = toPhoto(e);
  const reach = 22 / (canvas.getBoundingClientRect().width / state.width);
  dragging = hitCorner(corners, p, reach);
  if (dragging >= 0) canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (dragging < 0) return;
  corners[dragging] = toPhoto(e);
  dirty = true;
  updateDecide();
  draw();
  solve();
});
// However a drag ends (also when the browser cancels it or takes the pointer away), it ends
const endDrag = () => { dragging = -1; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('lostpointercapture', endDrag);
measuredBox.addEventListener('change', () => changed('長さの扱いを変えました'));

decideButton.addEventListener('click', async () => {
  decideButton.disabled = true;
  let out;
  try {
    const rounded = corners.map((c) => ({ u: Math.round(c.u * 10) / 10, v: Math.round(c.v * 10) / 10 }));
    out = await call('ps_site_decide', { corners: rounded, edgesM, measured: measuredBox.checked });
    if (!out.ok) {
      say(`場所を決定できませんでした: ${out.reason}`, true);
      updateDecide();
      return;
    }
  } catch (err) {
    fail('決定できませんでした', err);
    updateDecide();
    return;
  }
  decidedOnce = true;
  dirty = false;
  updateDecide();
  openSections();
  say(`決定しました。場所のファイルを書きました: ${out.sitePath}`);
});

async function start() {
  try {
    const res = await new Promise((resolve) => { app.ontoolresult = resolve; app.connect(); });
    state = JSON.parse(res.content[0].text);
    corners = state.floor.corners.map((c) => ({ ...c }));
    edgesM = [...state.floor.edgesM];
    measuredBox.checked = state.floor.measured;
    decidedOnce = state.floor.decided;
    dirty = !state.floor.decided;
    showLogin(state.login);
    showEdges();
    if (decidedOnce) openSections();
    updateDecide();
    for (const c of [canvas, mPhoto, mView, mGl]) {
      c.width = 1280;
      c.height = Math.round(1280 * state.height / state.width);
    }
    draw();
    // The photo in parts: each part is one small call
    let b64 = '';
    for (let part = 0; part < state.parts; part += 1) {
      say(`写真を読み込んでいます…（${part + 1}/${state.parts}）`);
      const out = await call('ps_spike_image', { imagePath: state.imagePath, part });
      b64 += out.data;
    }
    const img = new Image();
    img.onload = () => { photo = img; draw(); drawMachinePhoto(); solve(); };
    img.onerror = () => say('写真を表示できませんでした', true);
    img.src = `data:image/jpeg;base64,${b64}`;
  } catch (err) {
    fail('写真を読み込めませんでした', err);
  }
}

app.onhostcontextchanged = (c) => document.documentElement.classList.toggle('dark', c?.theme === 'dark');
document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
start();
</script>
